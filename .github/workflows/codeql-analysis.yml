name: CodeQL
'on':
  push:
    branches:
    - main
  schedule:
  - cron: 0 2 * * *
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  selective-checks:
    name: Selective checks
    runs-on: ubuntu-latest
    outputs:
      needs-python-scans: ${{ steps.selective-checks.outputs.needs-python-scans }}
      needs-javascript-scans: ${{ steps.selective-checks.outputs.needs-javascript-scans
        }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Install Breeze
      uses: ./.github/actions/breeze
    - name: Selective checks
      id: selective-checks
      env:
        COMMIT_REF: ${{ github.sha }}
        VERBOSE: 'false'
      run: breeze ci selective-check >> ${GITHUB_OUTPUT}
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs:
    - selective-checks
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
      if: 'matrix.language == ''python'' && needs.selective-checks.outputs.needs-python-scans
        == ''true'' ||

        matrix.language == ''javascript'' && needs.selective-checks.outputs.needs-javascript-scans
        == ''true''

        '
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
      if: 'matrix.language == ''python'' && needs.selective-checks.outputs.needs-python-scans
        == ''true'' ||

        matrix.language == ''javascript'' && needs.selective-checks.outputs.needs-javascript-scans
        == ''true''

        '
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      if: 'matrix.language == ''python'' && needs.selective-checks.outputs.needs-python-scans
        == ''true'' ||

        matrix.language == ''javascript'' && needs.selective-checks.outputs.needs-javascript-scans
        == ''true''

        '
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      if: 'matrix.language == ''python'' && needs.selective-checks.outputs.needs-python-scans
        == ''true'' ||

        matrix.language == ''javascript'' && needs.selective-checks.outputs.needs-javascript-scans
        == ''true''

        '
